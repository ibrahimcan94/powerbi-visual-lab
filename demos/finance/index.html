<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance OS — synthetic demo</title><style>html,body,#root{width:100%;height:100%;margin:0}html,
body {
  margin: 0;
}
.finance-dashboard,
.finance-dashboard * {
  box-sizing: border-box;
}
.finance-dashboard {
  --fd-accent: #2768ed;
  --fd-bg: #f0f2f5;
  --fd-surface: #fff;
  --fd-text: #344767;
  --fd-muted: #8992a4;
  --fd-line: #edf0f5;
  --fd-soft: #f8f9fc;
  display: flex;
  width: 100%;
  height: 100%;
  min-width: 320px;
  overflow: hidden;
  position: relative;
  background: var(--fd-bg);
  color: var(--fd-text);
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  isolation: isolate;
  container-type: inline-size;
}
.finance-dashboard.dark {
  --fd-bg: #171d2c;
  --fd-surface: #252d40;
  --fd-text: #e5eaf5;
  --fd-muted: #a3aec6;
  --fd-line: #353f55;
  --fd-soft: #20283a;
}
.finance-dashboard button,
.finance-dashboard input,
.finance-dashboard select {
  font: inherit;
}
.finance-dashboard button {
  cursor: pointer;
}
.finance-dashboard button:disabled {
  cursor: default;
  opacity: 0.45;
}
.finance-dashboard button:focus-visible,
.finance-dashboard select:focus-visible,
.finance-dashboard input:focus-visible,
.finance-dashboard .fd-hit:focus-visible {
  outline: 3px solid var(--fd-accent);
  outline-offset: 3px;
}
.finance-dashboard h1,
.finance-dashboard h2,
.finance-dashboard h3,
.finance-dashboard p {
  margin: 0;
}
.finance-dashboard button {
  -webkit-tap-highlight-color: transparent;
}
.fd-sidebar {
  width: 230px;
  flex: none;
  margin: 14px 0 14px 14px;
  border-radius: 12px;
  background: linear-gradient(170deg, #42424a, #202023);
  color: white;
  display: flex;
  flex-direction: column;
  padding: 22px 13px 16px;
  box-shadow: 0 3px 12px #24242c19;
  overflow-y: auto;
  transition: width 0.2s;
}
.fd-brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 0 10px 22px;
  border-bottom: 1px solid #ffffff1f;
  white-space: nowrap;
}
.fd-brand-mark {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid #ffffff65;
  border-radius: 9px;
  flex: none;
}
.fd-brand strong {
  font-size: 15px;
  letter-spacing: 0.8px;
  display: block;
}
.fd-brand div > span {
  font-size: 10px;
  color: #c1c2cb;
  letter-spacing: 0.7px;
}
.fd-workspace {
  display: flex;
  gap: 11px;
  align-items: center;
  border-bottom: 1px solid #ffffff1f;
  padding: 20px 8px 22px;
  margin-bottom: 24px;
  white-space: nowrap;
}
.fd-avatar {
  background: #9faaa0;
  color: #fff;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  font-size: 11px;
  letter-spacing: 0.5px;
  flex: none;
}
.fd-avatar.light {
  background: #e9efff;
  color: var(--fd-accent);
}
.fd-workspace strong {
  display: block;
  font-size: 12px;
  font-weight: 500;
}
.fd-workspace div > span {
  color: #a9aab5;
  font-size: 10px;
}
.fd-workspace-dot {
  width: 6px;
  height: 6px;
  background: #4cce9d;
  border-radius: 50%;
  margin-left: auto;
}
.fd-nav-label {
  font-size: 9px;
  letter-spacing: 1.4px;
  font-weight: 700;
  color: #b4b4bd;
  margin: 0 14px 12px;
}
.fd-sidebar nav {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.fd-sidebar nav button,
.fd-sidebar-bottom > button {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  border: 0;
  background: transparent;
  border-radius: 7px;
  padding: 13px;
  color: #d8d8e2;
  font-size: 12px;
  text-align: left;
  white-space: nowrap;
}
.fd-sidebar nav button:hover,
.fd-sidebar-bottom > button:hover {
  background: #ffffff12;
  color: white;
}
.fd-sidebar nav button.active {
  background: var(--fd-accent);
  color: #fff;
  box-shadow: 0 4px 12px #0002;
}
.fd-sidebar nav em {
  font-style: normal;
  font-size: 10px;
  margin-left: auto;
  border-radius: 5px;
  padding: 1px 5px;
  background: #ffffff24;
}
.fd-sidebar-bottom {
  margin-top: auto;
  padding-top: 50px;
}
.fd-sidebar-note {
  border-top: 1px solid #ffffff1f;
  margin-top: 16px;
  padding: 18px 8px 0;
  color: #b7b8c4;
  font-size: 10px;
}
.fd-sidebar-note small {
  display: block;
  padding-top: 8px;
  font-size: 9px;
  color: #8e909d;
}
.fd-live-dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #4fc99a;
  margin-right: 7px;
}
.fd-main {
  flex: 1;
  min-width: 0;
  overflow: auto;
  padding: 24px 27px 12px;
  scrollbar-width: thin;
  scrollbar-color: #c8cdd6 transparent;
}
.fd-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.fd-breadcrumb {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 10px;
  color: var(--fd-muted);
}
.fd-breadcrumb b {
  color: var(--fd-text);
  font-weight: 500;
}
.fd-title-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding-top: 3px;
}
.fd-title-row h1 {
  font-size: 21px;
  line-height: 1.4;
  font-weight: 700;
  outline: none;
  letter-spacing: -0.5px;
}
.fd-icon-button {
  display: grid;
  place-items: center;
  background: transparent;
  border: 0;
  border-radius: 7px;
  color: var(--fd-muted);
  width: 32px;
  height: 32px;
  flex: none;
}
.fd-icon-button:hover {
  background: var(--fd-line);
  color: var(--fd-text);
}
.fd-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.fd-search {
  display: flex;
  gap: 9px;
  align-items: center;
  border: 1px solid #d6dce7;
  border-radius: 7px;
  padding: 8px 10px;
  color: var(--fd-muted);
}
.fd-search input {
  background: none;
  border: 0;
  outline: none!important;
  min-width: 0;
  width: 205px;
  color: var(--fd-text);
  font-size: 11px;
}
.fd-search:focus-within {
  box-shadow: 0 0 0 2px var(--fd-accent);
}
.fd-search button {
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  color: var(--fd-muted);
}
.fd-source-badge {
  padding: 5px 8px;
  font-size: 8px;
  letter-spacing: 0.6px;
  font-weight: 700;
  white-space: nowrap;
  border-radius: 5px;
  background: #e5edff;
  color: #2866cc;
}
.fd-source-badge.report {
  color: #21815d;
  background: #dcf6e8;
}
.fd-intro {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--fd-muted);
  font-size: 10px;
  padding: 14px 0 18px;
}
.fd-intro > span {
  white-space: nowrap;
}
.fd-filterbar {
  display: flex;
  align-items: end;
  gap: 12px;
  margin-bottom: 31px;
}
.fd-filterbar label {
  flex: 1;
  min-width: 90px;
  color: var(--fd-muted);
  font-size: 9px;
  letter-spacing: 0.2px;
}
.fd-filterbar label:first-child {
  flex: 1.2;
}
.fd-filterbar select {
  display: block;
  border: 1px solid #dbe0e9;
  background: var(--fd-surface);
  color: var(--fd-text);
  width: 100%;
  border-radius: 6px;
  font-size: 11px;
  height: 34px;
  margin-top: 4px;
  padding: 0 8px;
}
.fd-reset {
  background: none;
  border: 0;
  color: var(--fd-accent);
  font-size: 10px;
  white-space: nowrap;
  padding: 9px 2px;
}
.fd-kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
  margin-bottom: 23px;
}
.fd-kpi {
  background: var(--fd-surface);
  border-radius: 11px;
  box-shadow: 0 2px 5px #27345312;
  position: relative;
  padding: 17px 15px 0;
  min-height: 111px;
}
.fd-kpi-icon {
  width: 48px;
  height: 48px;
  border-radius: 9px;
  color: #fff;
  display: grid;
  place-items: center;
  position: absolute;
  top: -11px;
  left: 16px;
  box-shadow: 0 5px 10px #26334925;
}
.fd-kpi-icon.ink {
  background: linear-gradient(145deg, #4b4b55, #222227);
}
.fd-kpi-icon.blue {
  background: linear-gradient(145deg, #459df4, #2360e8);
}
.fd-kpi-icon.green {
  background: linear-gradient(145deg, #4dc790, #1da671);
}
.fd-kpi-icon.pink {
  background: linear-gradient(145deg, #ed6c9d, #dc3875);
}
.fd-kpi-body {
  text-align: right;
  min-height: 53px;
  padding-left: 48px;
}
.fd-kpi-body > span {
  display: block;
  font-size: 10px;
  color: var(--fd-muted);
  white-space: nowrap;
}
.fd-kpi-body > strong {
  font-size: 24px;
  letter-spacing: -0.8px;
  font-weight: 700;
  line-height: 1.6;
  white-space: nowrap;
}
.fd-kpi-footer {
  border-top: 1px solid var(--fd-line);
  margin-top: 10px;
  padding: 9px 0;
  font-size: 9px;
  color: var(--fd-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 4px;
}
.fd-kpi-footer button {
  display: grid;
  place-items: center;
  border: 0;
  background: none;
  color: var(--fd-muted);
  padding: 0;
}
.positive {
  color: #2d9f71 !important;
}
.negative {
  color: #dc5277 !important;
}
.fd-panel {
  background: var(--fd-surface);
  border-radius: 11px;
  padding: 19px 20px 10px;
  box-shadow: 0 2px 5px #27345312;
  margin-bottom: 22px;
  min-width: 0;
}
.fd-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding-bottom: 14px;
}
.fd-panel h2 {
  font-size: 13px;
  font-weight: 650;
}
.fd-panel-header p {
  color: var(--fd-muted);
  font-size: 10px;
  padding-top: 4px;
}
.fd-pill {
  background: var(--fd-soft);
  color: var(--fd-muted);
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 8px;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.fd-regional-body {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 34px;
  align-items: center;
}
.fd-region-table {
  min-width: 0;
}
.fd-region-labels,
.fd-region-table > button {
  display: grid;
  grid-template-columns: 1.45fr 1fr 0.7fr 1fr;
  align-items: center;
  gap: 8px;
}
.fd-region-labels {
  padding: 0 4px 9px;
  font-size: 9px;
  color: var(--fd-muted);
  border-bottom: 1px solid var(--fd-line);
}
.fd-region-labels span:not(:first-child) {
  text-align: right;
}
.fd-region-table > button {
  background: none;
  border: 0;
  border-bottom: 1px solid var(--fd-line);
  padding: 10px 4px;
  width: 100%;
  color: var(--fd-text);
  font-size: 11px;
}
.fd-region-table > button:last-child {
  border: 0;
}
.fd-region-table > button:hover {
  background: var(--fd-soft);
}
.fd-region-table > button > span:first-child {
  display: flex;
  align-items: center;
  gap: 9px;
}
.fd-region-table b {
  font-weight: 500;
  font-size: 10px;
  text-align: left;
}
.fd-region-table strong {
  font-size: 11px;
  font-weight: 600;
}
.fd-region-table > button > *:not(:first-child) {
  text-align: right;
}
.fd-region-icon {
  flex: none;
  font-size: 9px;
  font-style: normal;
  font-weight: 600;
  width: 27px;
  height: 27px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: #e5edff;
  color: #3d78d7;
}
.fd-region-icon.r1 {
  background: #f0eaff;
  color: #9174c3;
}
.fd-region-icon.r2 {
  background: #e3f5ec;
  color: #399f79;
}
.fd-region-icon.r3 {
  background: #fcf0dc;
  color: #c49540;
}
.fd-aging-donut {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.fd-aging-donut svg {
  width: 155px;
  min-width: 130px;
}
.fd-donut-label {
  fill: var(--fd-muted);
  font-size: 9px;
  letter-spacing: 0.8px;
}
.fd-donut-value {
  fill: var(--fd-text);
  font-size: 24px;
  font-weight: 700;
}
.fd-aging-donut > div {
  min-width: 130px;
}
.fd-aging-donut button {
  display: flex;
  gap: 6px;
  align-items: center;
  background: none;
  border: 0;
  padding: 5px 0;
  font-size: 9px;
  color: var(--fd-muted);
  width: 100%;
}
.fd-aging-donut button > i {
  width: 6px;
  height: 6px;
  border-radius: 2px;
}
.fd-aging-donut button > b {
  margin-left: auto;
  color: var(--fd-text);
  font-weight: 500;
  padding-left: 14px;
}
.fd-charts-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  margin: 40px 0 22px;
}
.fd-chart-card {
  min-width: 0;
  background: var(--fd-surface);
  border-radius: 11px;
  box-shadow: 0 2px 5px #27345312;
  position: relative;
}
.fd-plot {
  position: relative;
  margin: 14px 13px 0;
  border-radius: 9px;
  padding: 12px 4px 4px;
  min-height: 150px;
}
.fd-plot svg {
  display: block;
  width: 100%;
  height: 166px;
  overflow: visible;
}
.fd-grid {
  stroke: var(--fd-line);
  stroke-dasharray: 4 4;
}
.fd-axis {
  font-size: 10px;
  fill: var(--fd-muted);
}
.fd-crosshair {
  stroke: var(--fd-muted);
  stroke-dasharray: 3 3;
}
.raised .fd-plot {
  margin: -18px 13px 0;
  box-shadow: 0 7px 12px #26334920;
}
.raised.blue .fd-plot {
  background: linear-gradient(130deg, #358cf1, #245be7);
}
.raised.green .fd-plot {
  background: linear-gradient(130deg, #40bd85, #1ca36c);
}
.raised.ink .fd-plot {
  background: linear-gradient(130deg, #494954, #25252c);
}
.raised .fd-axis {
  fill: #ffffffb0;
}
.raised .fd-grid {
  stroke: #ffffff28;
}
.raised .fd-crosshair {
  stroke: #ffffffa0;
}
.fd-chart-caption {
  padding: 16px 17px 0;
}
.fd-chart-caption h3 {
  font-size: 13px;
}
.fd-chart-caption p {
  font-size: 10px;
  color: var(--fd-muted);
  padding: 5px 0 12px;
}
.fd-chart-foot {
  border-top: 1px solid var(--fd-line);
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
  font-size: 8px;
  color: var(--fd-muted);
  padding: 10px 0;
}
.fd-chart-foot i {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 5px;
}
.fd-chart-hint {
  margin-left: auto;
}
.fd-chart-tooltip {
  position: absolute;
  background: var(--fd-surface);
  color: var(--fd-text);
  border: 1px solid var(--fd-line);
  border-radius: 7px;
  box-shadow: 0 3px 15px #18213822;
  padding: 9px 12px;
  font-size: 10px;
  pointer-events: none;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  min-width: 140px;
  z-index: 2;
}
.fd-chart-tooltip strong {
  display: block;
  font-size: 10px;
  padding-bottom: 4px;
}
.fd-chart-tooltip span {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  font-size: 9px;
}
.fd-hit {
  cursor: pointer;
}
.fd-hit:focus-visible {
  stroke: var(--fd-text);
  stroke-width: 2;
  outline: none!important;
}
.fd-bottom-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 22px;
}
.fd-two-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-bottom: 22px;
  align-items: stretch;
}
.fd-two-grid > .fd-panel {
  margin: 0;
}
.fd-two-grid > .fd-chart-card .fd-plot svg {
  height: 205px;
}
.fd-text-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 0;
  color: var(--fd-accent);
  font-size: 10px;
  padding: 3px 0;
  white-space: nowrap;
}
.fd-bar-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: 8px;
}
.fd-bar-row {
  display: grid;
  grid-template-columns: minmax(90px, 1.2fr) 1.2fr 68px 13px;
  gap: 12px;
  align-items: center;
  width: 100%;
  background: none;
  border: 0;
  color: var(--fd-text);
  padding: 10px 0;
}
.fd-bar-row:disabled {
  opacity: 1;
}
.fd-bar-label {
  font-size: 10px;
  text-align: left;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}
.fd-bar-track {
  display: block;
  background: var(--fd-line);
  height: 5px;
  border-radius: 5px;
}
.fd-bar-track > span {
  height: 5px;
  display: block;
  border-radius: 5px;
}
.fd-bar-row strong {
  text-align: right;
  font-size: 11px;
  font-weight: 500;
}
.fd-pulse > div {
  padding: 10px 0;
  border-bottom: 1px solid var(--fd-line);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.fd-pulse > div:last-child {
  border: 0;
}
.fd-pulse span {
  color: var(--fd-muted);
  font-size: 10px;
}
.fd-pulse strong {
  font-size: 17px;
}
.fd-pulse small {
  color: var(--fd-muted);
  font-size: 12px;
  font-weight: 400;
}
.fd-pulse progress {
  appearance: none;
  width: 100%;
  height: 5px;
  border: 0;
  background: var(--fd-line);
  border-radius: 4px;
}
.fd-pulse progress::-webkit-progress-bar {
  background: var(--fd-line);
  border-radius: 4px;
}
.fd-pulse progress::-webkit-progress-value {
  background: #43b98b;
  border-radius: 4px;
}
.fd-table-wrap {
  width: 100%;
  overflow: auto;
}
.fd-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  white-space: nowrap;
}
.fd-table th {
  font-weight: 600;
  color: var(--fd-muted);
  text-align: left;
  border-bottom: 1px solid var(--fd-line);
  font-size: 9px;
  letter-spacing: 0.2px;
}
.fd-table th button {
  color: inherit;
  background: none;
  border: 0;
  padding: 10px 8px;
  text-align: inherit;
  font-weight: 600;
  font-size: 9px;
}
.fd-table th button span {
  opacity: 0.6;
  font-size: 9px;
}
.fd-table td {
  padding: 13px 8px;
  border-bottom: 1px solid var(--fd-line);
}
.fd-table .numeric {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.fd-table tbody tr:last-child td {
  border: 0;
}
.fd-table tbody tr:hover {
  background: var(--fd-soft);
}
.fd-row-link {
  display: block;
  text-align: left;
  background: none;
  border: 0;
  padding: 0;
  color: var(--fd-text);
  font-size: 11px;
}
.fd-row-link:hover {
  color: var(--fd-accent);
}
.fd-row-link strong {
  display: block;
  font-size: 11px;
  font-weight: 600;
}
.fd-row-link small {
  display: block;
  color: var(--fd-muted);
  font-size: 9px;

.fd-search input:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
@container (max-width: 900px) {
  .fd-required-fields {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .fd-connect-panel {
    padding: 28px;
  }
}
@container (max-width: 570px) {
  .fd-connect-panel {
    padding: 20px 13px;
  }
  .fd-connect-panel h2 {
    font-size: 21px;
  }
  .fd-required-fields {
    gap: 6px;
  }
  .fd-required-fields > span {
    padding: 8px 6px;
    font-size: 9px;
  }
}
